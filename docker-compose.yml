services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://booking:booking@db:5432/booking
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
      CLINIC_TIMEZONE: Asia/Dhaka
      SCHEDULER_ENABLED: "true"
      CORS_ORIGINS: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  seed:
    build: ./backend
    command: ["python", "-m", "app.seed"]
    environment:
      DATABASE_URL: postgresql+psycopg://booking:booking@db:5432/booking
      SCHEDULER_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: /api
        VITE_ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
